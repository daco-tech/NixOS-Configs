name: Validate NixOS configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Evaluate and build x1-extreme
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Enable Nix store caching
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Check flake outputs
        run: nix flake check --no-build

      - name: Evaluate NixOS host
        run: nix eval --raw .#nixosConfigurations.x1-extreme.config.system.build.toplevel.drvPath

      - name: Build NixOS system closure
        run: nix build --no-link .#nixosConfigurations.x1-extreme.config.system.build.toplevel
